name: Build and deploy

on:
  push:
    branches: [main]

env:
  BACKEND_IMAGE: yasir019/todo-backend
  FRONTEND_IMAGE: yasir019/todo-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Each image gets two tags: the commit SHA (a unique version to deploy
      # and roll back to) and "latest".
      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      # The deploy hook tells Render to switch the service to the new image tag.
      - name: Deploy the backend on Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error "${DEPLOY_HOOK}&imgURL=docker.io%2F${BACKEND_IMAGE}%3A${GITHUB_SHA}"

      - name: Deploy the frontend on Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error "${DEPLOY_HOOK}&imgURL=docker.io%2F${FRONTEND_IMAGE}%3A${GITHUB_SHA}"
