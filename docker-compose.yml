services:
  todo-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    volumes:
      - todo-data:/var/lib/postgresql/data
    restart: unless-stopped

  todo-backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://todo:todo@todo-db:5432/todo
    depends_on:
      - todo-db
    restart: unless-stopped

  todo-frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      BACKEND_URL: http://todo-backend:5000
    depends_on:
      - todo-backend
    restart: unless-stopped

volumes:
  todo-data:
    external: true
